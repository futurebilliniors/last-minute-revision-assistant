<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Last Minute Revision Assistant — Revise smarter. Prioritize what matters most."
    />
    <title>Last Minute Revision Assistant</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      (function () {
        try {
          var t = localStorage.getItem('lmra-theme');
          if (t !== 'light' && t !== 'dark')
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232147e0'/%3E%3Cpath d='M10 9h9a5 5 0 0 1 0 10h-4v6h-5V9zm5 4v3h4a1.5 1.5 0 0 0 0-3h-4z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
